<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>루틴 놀이터</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light dark;
    --bg:#eef8fb; --bg-grad:linear-gradient(160deg,#eaf7fb 0%,#e7fbf5 100%);
    --card-bg:#ffffff; --card-bg-soft:#f4fbfd;
    --sky:#3fb6e0; --sky-strong:#2a9fcb; --sky-light:#dbf2fb;
    --mint:#3fd6bf; --mint-strong:#22b39d; --mint-light:#dcf9f2;
    --text:#1f2d3a; --text-soft:#6b7f8c; --text-faint:#9db0bb;
    --border:#e1eef2; --border-strong:#c9dfe6;
    --shadow-sm:0 2px 8px rgba(31,64,80,.06); --shadow-md:0 8px 24px rgba(31,64,80,.10);
    --radius-lg:22px;
    --danger:#f0645f; --danger-light:#fde6e5; --warning:#f5a623; --warning-light:#fff3dc; --warning-text:#a8660a;
    --violet:#6b7fd7; --violet-strong:#5667c2;
    --font-main:'Jua',-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1620; --bg-grad:linear-gradient(160deg,#0d1620 0%,#0d1c1c 100%);
      --card-bg:#161f2a; --card-bg-soft:#131b25;
      --sky:#4fc3ec; --sky-strong:#6fd0f0; --sky-light:#16303a;
      --mint:#3fe0c6; --mint-strong:#4fe8d0; --mint-light:#123028;
      --text:#e8f1f5; --text-soft:#9fb3bf; --text-faint:#6d8390;
      --border:#233240; --border-strong:#2e4250;
      --shadow-sm:0 2px 8px rgba(0,0,0,.25); --shadow-md:0 8px 24px rgba(0,0,0,.35);
      --danger:#ff6b66; --danger-light:#3a1f20; --warning:#ffb84d; --warning-light:#3a2c14; --warning-text:#ffb84d;
      --violet:#96a6ee; --violet-strong:#7f90e0;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0 0 60px;font-family:var(--font-main);background:var(--bg);background-image:var(--bg-grad);color:var(--text);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{margin:0;font-family:var(--font-main);font-weight:400;}
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 40px;}
  [hidden]{display:none!important;}

  .topbar{background:var(--card-bg);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .topbar h1{font-size:20px;display:flex;align-items:center;gap:8px;background:linear-gradient(100deg,var(--sky-strong),var(--mint-strong));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .profiles{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
  .hdrwrap{padding-bottom:0;}
  .hdr{margin-bottom:0;padding:16px 20px;}
  .hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .hcal{flex:0 0 auto;width:56px;border:1px solid var(--border-strong);border-radius:12px;overflow:hidden;text-align:center;background:var(--card-bg);}
  .hcal .m{background:var(--sky-strong);color:#fff;font-size:12px;padding:1px 0;}
  .hcal .d{font-size:24px;line-height:1.25;padding-bottom:1px;}
  .hcal .w{font-size:12px;color:var(--text-soft);padding-bottom:3px;}
  .hnav{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--border-strong);background:var(--card-bg);color:var(--text-soft);cursor:pointer;font-family:inherit;font-size:12px;padding:0;}
  .htxt{flex:1;min-width:160px;}
  .htxt h2{font-size:21px;margin:0 0 2px;display:block;}
  .htxt .hs{font-size:13.5px;color:var(--text-soft);line-height:1.5;}
  .hring{flex:0 0 auto;position:relative;width:58px;height:58px;}
  .hring svg{width:100%;height:100%;transform:rotate(-90deg);}
  .hring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;}
  @media (max-width:620px){.hrow{flex-wrap:nowrap;gap:8px;}.hnav{width:26px;height:26px;}.htxt{min-width:0;}.htxt h2{font-size:17px;word-break:keep-all;line-height:1.3;}.htxt .hs{font-size:12.5px;}.hring{width:50px;height:50px;}.hring span{font-size:12px;}.hdr{padding:14px 14px;}}
  .seg{display:flex;gap:2px;background:var(--sky-light);border-radius:14px;padding:4px;margin-top:14px;overflow-x:auto;scrollbar-width:none;}
  .seg::-webkit-scrollbar{display:none;}
  .seg .mtab{flex:1 0 auto;border:none;border-radius:11px;padding:9px 12px;font-size:14.5px;text-align:center;}
  .seg .mtab.on{background:var(--card-bg);color:var(--text);box-shadow:var(--shadow-sm);border:none;}
  .nav{position:sticky;top:0;z-index:60;background:var(--card-bg);box-shadow:var(--shadow-sm);}
  .tabs{max-width:820px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 16px 0;}
  .tabs::-webkit-scrollbar{display:none;}
  .mtab{flex:0 0 auto;font-family:inherit;cursor:pointer;white-space:nowrap;font-size:14.5px;color:var(--text-soft);background:transparent;border:none;border-bottom:3px solid transparent;padding:8px 14px 10px;transition:color .15s,border-color .15s;}
  .mtab:hover{color:var(--text);}
  .mtab.on{color:var(--sky-strong);border-bottom-color:var(--sky);}
  .mtab:focus-visible{outline:3px solid var(--sky);outline-offset:-3px;border-radius:6px;}

  .card{background:var(--card-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:20px;margin-bottom:18px;border:1px solid var(--border);}
  .card h2{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .card .sub{font-size:13.5px;color:var(--text-soft);margin:0 0 14px;}
  .card.mine{border:2px dashed var(--border-strong);background:var(--card-bg-soft);box-shadow:none;}
  .mine h3{font-size:16px;margin:0 0 10px;}
  .hl{color:var(--sky-strong);}
  .muted{color:var(--text-soft);font-size:13px;}
  .err{font-size:12.5px;color:var(--danger);min-height:18px;margin:6px 0 0;}
  .card.notecard{padding:0;overflow:hidden;}
  .notehd{width:100%;display:flex;align-items:center;gap:8px;background:none;border:none;font-family:inherit;font-size:18px;color:var(--text);padding:14px 18px;cursor:pointer;text-align:left;}
  .notehd .nb{background:var(--sky-light);color:var(--sky-strong);font-size:12.5px;border-radius:999px;padding:1px 9px;}
  .notehd .ar{margin-left:auto;color:var(--text-soft);font-size:14px;}
  .notebody{padding:0 18px 16px;}
  .notebody textarea{width:100%;min-height:84px;resize:vertical;font-family:inherit;font-size:15px;line-height:1.6;color:var(--text);background:var(--card-bg-soft);border:1.5px solid var(--border);border-radius:14px;padding:10px 12px;}
  .notebody textarea:focus{outline:none;border-color:var(--sky);}
  .noteadd{display:flex;justify-content:flex-end;margin:8px 0 4px;}
  .noteitem{display:flex;gap:8px;align-items:flex-start;background:var(--card-bg-soft);border:1px solid var(--border);border-radius:12px;padding:8px 10px;margin-top:8px;}
  .noteitem .nt{flex:1;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.6;}
  .nchk{display:flex;flex-direction:column;gap:6px;}
  .nrow{display:flex;gap:8px;align-items:flex-start;}
  .nrow .chk{width:24px;height:24px;font-size:13px;margin-top:1px;}
  .nrow.on .chk{background:var(--mint-strong);border-color:var(--mint-strong);}
  .nrow.on .ntx{text-decoration:line-through;color:var(--text-soft);}
  .nsub{font-size:13px;color:var(--text-soft);white-space:pre-wrap;}
  .nrest{margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);}
  .noteitem .nd{font-size:11.5px;color:var(--text-faint);}
  .empty{text-align:center;color:var(--text-soft);padding:18px 8px;font-size:14px;}

  .btn{font-family:inherit;font-size:14.5px;cursor:pointer;border:none;border-radius:20px;padding:9px 20px;color:#fff;white-space:nowrap;background:linear-gradient(100deg,var(--sky),var(--mint));box-shadow:0 3px 0 var(--mint-strong);transition:transform .08s,box-shadow .08s;}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--mint-strong);}
  .btn:focus-visible,.chip:focus-visible,.chk:focus-visible{outline:3px solid var(--sky);outline-offset:2px;}
  .btn.sm{font-size:13px;padding:6px 14px;}
  .btn.ghost{background:var(--card-bg);color:var(--text-soft);border:1px solid var(--border-strong);box-shadow:none;}
  .btn.ghost:active{transform:translateY(1px);}
  .btn.pause{background:var(--violet);box-shadow:0 3px 0 var(--violet-strong);}
  .btn.pause:active{box-shadow:0 1px 0 var(--violet-strong);}
  .btn.warn{background:var(--warning-light);color:var(--warning-text);border:1.5px solid var(--warning);box-shadow:0 3px 0 var(--warning);}
  .btn.danger{background:var(--danger-light);color:var(--danger);border:1.5px solid var(--danger);box-shadow:0 3px 0 var(--danger);}

  .chip{font-family:inherit;cursor:pointer;white-space:nowrap;font-size:13.5px;color:var(--text-soft);background:var(--card-bg);border:1px solid var(--border-strong);border-radius:20px;padding:5px 13px;transition:all .15s;}
  .chip:hover{border-color:var(--sky);color:var(--text);}
  .chip.on{background:linear-gradient(100deg,var(--sky),var(--mint));color:#fff;border-color:transparent;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;}

  .tag{display:inline-block;font-size:11px;padding:1px 9px;border-radius:20px;white-space:nowrap;vertical-align:middle;background:var(--sky-light);color:var(--sky-strong);}
  .tag.ok{background:var(--mint-light);color:var(--mint-strong);}
  .tag.bad{background:var(--danger-light);color:var(--danger);}
  .tag.x{background:var(--warning-light);color:var(--warning-text);}
  .src{display:inline-block;font-size:12px;color:#fff;border-radius:20px;padding:2px 12px;background:linear-gradient(100deg,var(--sky),var(--mint));}

  input.txt,input.minp{font-family:inherit;font-size:15px;color:var(--text);background:var(--card-bg);border:1px solid var(--border-strong);border-radius:10px;padding:9px 11px;min-width:0;}
  input.txt{flex:1 1 180px;}
  input.minp{width:64px;text-align:center;}
  input.txt:focus,input.minp:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-light);}
  input::placeholder{color:var(--text-faint);}
  .addrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .stepper{display:flex;align-items:center;gap:6px;color:var(--text-soft);}
  .stepper .btn{padding:5px 12px;}

  .datenav{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .datenav .dn{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .progrow{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;}
  .prog{height:14px;border-radius:10px;background:var(--sky-light);overflow:hidden;}
  .prog i{display:block;height:100%;border-radius:10px;background:linear-gradient(100deg,var(--sky),var(--mint));transition:width .4s;}

  .list{display:flex;flex-direction:column;gap:8px;}
  .task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card-bg-soft);border:1px solid var(--border);border-left:5px solid var(--sky);border-radius:12px;padding:11px 14px;}
  .task.done{border-left-color:var(--mint-strong);}
  .task.done .tn{text-decoration:line-through;opacity:.6;}
  .task.over{border-left-color:var(--danger);}
  .tn{font-size:15.5px;}
  .ts{font-size:12.5px;color:var(--text-soft);}
  .tt{display:flex;align-items:center;gap:8px;}
  .chk{width:28px;height:28px;flex:none;cursor:pointer;font-family:inherit;border-radius:9px;border:2px solid var(--border-strong);background:var(--card-bg);color:#fff;font-size:15px;line-height:1;padding:0;}
  .chk:hover{border-color:var(--mint);}
  .task.done .chk{background:var(--mint-strong);border-color:var(--mint-strong);}
  .x-del,.ic{border:none;background:none;color:var(--text-faint);font-size:15px;cursor:pointer;padding:2px 7px;border-radius:6px;font-family:inherit;}
  .x-del:hover,.ic.del:hover{background:var(--danger-light);color:var(--danger);}
  .ic:hover{background:var(--sky-light);color:var(--sky-strong);}

  .row2{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card-bg-soft);border:1px solid var(--border);border-radius:12px;padding:10px 14px;}
  .row2 .nm{font-size:15px;}
  .row2 .ds{font-size:12.5px;color:var(--text-soft);}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
  .fact{background:var(--card-bg-soft);border:1px solid var(--border);border-radius:12px;padding:10px 14px;}
  .fact .lbl{font-size:11.5px;color:var(--text-soft);}
  .fact .val{font-size:20px;}
  .fact .val small{font-size:12px;color:var(--text-faint);}
  .bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;}
  .bcol{text-align:center;}
  .btrack{height:120px;border-radius:10px;background:var(--sky-light);display:flex;align-items:flex-end;overflow:hidden;}
  .btrack i{display:block;width:100%;background:var(--sky);border-radius:10px 10px 0 0;transition:height .4s;}
  .btrack i.full{background:linear-gradient(0deg,var(--mint),var(--sky));}
  .bl{font-size:13.5px;margin-top:4px;}
  .bn{font-size:12px;color:var(--text-soft);}
  .bcol.today .bl{color:var(--sky-strong);}
  .wknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;}

  .bal{font-size:34px;color:var(--mint-strong);}
  .daysel{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0;}

  .clk{cursor:pointer;border-radius:8px;}
  .lbtag{margin-right:8px;font-size:12px;padding:2px 10px;}
  .clk:focus-visible{outline:3px solid var(--sky);outline-offset:3px;}
  .task.skipped{border-style:dashed;opacity:.75;border-left-color:var(--border-strong);}
  .task.skipped .tn{color:var(--text-soft);}
  .mback{position:fixed;inset:0;background:rgba(15,30,40,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0;}
  .modal{background:var(--card-bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 20px 24px;outline:none;box-shadow:var(--shadow-md);}
  @media (min-width:700px){.mback{align-items:center;padding:20px;}.modal{border-radius:22px;}}
  .mhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .mhead h2{flex:1;font-size:20px;margin:0;}
  .mx{width:40px;height:40px;border-radius:50%;border:none;background:var(--sky-light);color:var(--text-soft);font-size:16px;cursor:pointer;font-family:inherit;}
  .mx:focus-visible{outline:3px solid var(--sky);outline-offset:2px;}
  .mlbl{font-size:13px;color:var(--text-soft);margin:12px 0 6px;display:block;}
  input.mbig{width:100%;font-size:18px;padding:12px 14px;}
  .mtime{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border-strong);border-radius:14px 14px 0 0;border-bottom:none;padding:10px 14px 0;}
  .mval{font-size:15px;color:var(--text-soft);}
  .mval b{font-size:40px;font-weight:400;color:var(--text);}
  .ruler{display:grid;grid-template-columns:repeat(11,1fr);border:1px solid var(--border-strong);border-top:none;border-radius:0 0 14px 14px;padding:4px 6px 8px;margin-bottom:12px;}
  .tick{font-family:inherit;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-faint);padding:4px 0;font-size:12.5px;}
  .tick i{display:block;width:2px;height:10px;border-radius:2px;background:var(--border-strong);}
  .tick.on{color:var(--mint-strong);font-size:15px;}
  .tick.on i{height:24px;width:3px;background:var(--mint-strong);}
  .tick:focus-visible{outline:3px solid var(--sky);outline-offset:1px;border-radius:6px;}
  .mnote{margin:10px 0 0;font-size:14px;}
  .mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;}
  .chip.ico{padding:6px 10px;line-height:0;}
  .chip.plus{border-style:dashed;color:var(--sky-strong);}
  .chip.lbl{cursor:default;}
  .chip.lbl:hover{border-color:var(--border-strong);color:var(--text-soft);}
  .lc-sky{--lb:#dbf2fb;--lt:#1f7fa6;--ld:#3fb6e0;}
  .lc-mint{--lb:#dcf9f2;--lt:#16806f;--ld:#3fd6bf;}
  .lc-pink{--lb:#fde4ee;--lt:#b0305f;--ld:#f08fb0;}
  .lc-orange{--lb:#ffe9d6;--lt:#b45a10;--ld:#f5a35c;}
  .lc-yellow{--lb:#fff4c9;--lt:#8a6a00;--ld:#f0c93a;}
  .lc-purple{--lb:#ece4fb;--lt:#6a45b5;--ld:#a98be0;}
  .lc-red{--lb:#fde2e2;--lt:#b32f2f;--ld:#ee6b6b;}
  .lc-gray{--lb:#e9edf1;--lt:#59646f;--ld:#9aa5b1;}
  @media (prefers-color-scheme: dark){
    .lc-sky{--lb:#16303a;--lt:#8fdcf6;}.lc-mint{--lb:#123028;--lt:#7aeed8;}.lc-pink{--lb:#3a1c2a;--lt:#f6a9c5;}.lc-orange{--lb:#3a2614;--lt:#f8bd86;}
    .lc-yellow{--lb:#363013;--lt:#f4d95e;}.lc-purple{--lb:#2b2145;--lt:#c4adf0;}.lc-red{--lb:#3b1c1c;--lt:#f59a9a;}.lc-gray{--lb:#252c33;--lt:#b4bec8;}
  }
  .tag.lbtag{background:var(--lb);color:var(--lt);font-size:13px;padding:3px 12px 3px 9px;display:inline-flex;align-items:center;gap:5px;vertical-align:middle;}
  .tag.lbtag svg{flex:0 0 auto;}
  .csw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;background:var(--ld);cursor:pointer;padding:0;}
  .csw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--card-bg) inset;}
  .cdt{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ld);margin-right:2px;vertical-align:0;}
  button.cdt{border:none;cursor:pointer;padding:0;width:14px;height:14px;}
  .cwrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px;}
  .lbl-x{border:none;background:none;color:var(--text-faint);cursor:pointer;font-size:12px;padding:0 0 0 8px;font-family:inherit;}
  .lbl-x:hover{color:var(--danger);}
  .lblform{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--card-bg);border:1px solid var(--border);}
  .daysel .chip svg{vertical-align:-3px;}
  .task{position:relative;}
  .task.active{border-color:var(--mint-strong);border-left-color:var(--mint-strong);}
  .task.active.over{border-color:var(--danger);border-left-color:var(--danger);}
  .cico{display:inline-flex;vertical-align:-4px;margin-right:8px;color:var(--sky-strong);}
  .nm .cico{margin-right:6px;}
  .tbody{min-width:0;}
  .pg{margin-top:10px;}
  .pgbar{height:8px;border-radius:6px;background:var(--sky-light);overflow:hidden;}
  .pgbar i{display:block;height:100%;border-radius:6px;background:var(--mint-strong);transition:width .9s linear;}
  .task.over .pgbar i{background:var(--danger);}
  .pgtxt{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text-soft);margin-top:5px;}
  .pgm{font-size:13.5px;margin-top:4px;color:var(--text);}
  .more{width:38px;height:38px;border-radius:12px;border:1px solid var(--border-strong);background:var(--card-bg);color:var(--text-soft);cursor:pointer;font-size:18px;line-height:1;padding:0;font-family:inherit;}
  .more.del{margin-right:6px;color:var(--text-faint);}
  .more.del:hover{border-color:var(--danger);color:var(--danger);}
  .more:hover{border-color:var(--sky);color:var(--text);}
  .more:focus-visible,.tmenu button:focus-visible{outline:3px solid var(--sky);outline-offset:2px;}
  .tmenu{position:absolute;right:14px;top:58px;z-index:30;background:var(--card-bg);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow-md);padding:6px;min-width:150px;display:flex;flex-direction:column;}
  .tmenu button{font-family:inherit;font-size:14px;text-align:left;color:var(--text);background:none;border:none;border-radius:8px;padding:9px 12px;cursor:pointer;}
  .tmenu button:hover{background:var(--sky-light);}
  .tmhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .tmtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .tmhead h2{flex:0 1 auto;font-size:24px;margin:0;}
  .tmhead{justify-content:center;}

    db.routines[p.id]=fbArr(db.routines[p.id]).filter(function(r){return r&&typeof r==='object';});

function syErr(e,what){
  var m=String(e&&e.message||'');
  if(/http 40[13]/.test(m))return what+'못했어요: Firebase 규칙이 막고 있어요 (Realtime Database → 규칙 탭에 안내한 내용을 붙여 넣고 게시)';
  if(/http 404/.test(m))return what+'못했어요: 주소를 찾을 수 없어요 (Realtime Database의 주소가 맞는지 확인)';
  if(/http 423|http 5/.test(m))return what+'못했어요: Firebase 서버 오류예요 ('+m+')';
  return what+'못했어요: 이 화면에서 인터넷 연결이 막혀 있어요 (앱 안 미리보기가 아니라 크롬·사파리에서 파일을 직접 열어 주세요)';
}
function syPush(){
  if(!syOk()||typeof fetch!=='function')return;
  fetch(syUrl(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(DB)}).then(function(r){
    if(!r.ok)throw new Error('http '+r.status);syStat('연동 중 · 저장 '+syTime());
  }).catch(function(e){syStat(syErr(e,'저장하지 '),true);});
}
function syBusyUi(){var a=document.activeElement;return !!ui.modal||(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'));}

  fetch(syUrl()).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();}).then(function(r){
    syBusy=false;

    var ru=+r.updated||0,lu=+DB.updated||0;
    if(force||ru>lu){

      ui.timerKey=null;try{render();}catch(e2){syStat('받아온 기록을 화면에 그리지 못했어요',true);return;}syStat('연동 중 · 받아옴 '+syTime());
    }else if(ru<lu){syPush();}

function parseNote(text){
  var lines=String(text).replace(/\r/g,'').split('\n'),st=0,end,i,tasks=[],last=null;
  while(st<lines.length&&!lines[st].trim())st++;
  end=-1;
  for(i=st;i<lines.length;i++){if(!lines[i].trim()){end=i;break;}}
  if(end<0){/* 빈 줄이 없으면 "* AR", "◈", 첫 번호 줄 같은 머리표에서 나눈다 */
    for(i=st+1;i<lines.length;i++){if(/^\s*(?:\*|\u25c8|1\s*[.)]\s)/.test(lines[i])){end=i;break;}}
    if(end<0)end=lines.length;
  }
  for(i=st;i<end;i++){
    var ln=lines[i];
    if(last&&/^\s*[-\u2013\u2022]\s*\S/.test(ln)){last.sub.push(ln.trim());continue;}
    var tx=ln.trim().replace(/^(?:[\u2b50\u2605\u2606\u25a0\u25c6\u25c8\u25cf\u2022*]\ufe0f?\s*|\d+\s*[.)]\s*)+/,'').trim();
    last={id:uid(),text:tx||ln.trim(),sub:[],done:false};tasks.push(last);
  }
  tasks.forEach(function(t){t.sub=t.sub.join('\n');});
  return {tasks:tasks,rest:lines.slice(end).join('\n').replace(/^\s*\n/,'').replace(/\n{3,}/g,'\n\n').trim()};
}

function rulerHtml(v){
  var c=Math.round(v/5)*5,st=Math.max(5,c-25),h='';
  for(var i=0;i<11;i++){var val=st+i*5;h+='<button class="tick'+(val===v?' on':'')+'" data-act="mtick" data-v="'+val+'" aria-label="'+val+'분"><i></i><span>'+val+'</span></button>';}
  return h;
}
function openModal(t){
  var isX=t.kind==='x',isToday=ui.date===todayKey(),recent=recentTasks();
  ui.modal={k:t.kind+':'+t.id,min:t.min,cat:catOf(t.cat).id,recent:recent,confirm:false};
  var h='<div class="mback" id="mback"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" tabindex="-1">'+
    '<div class="mhead"><h2 id="mTitle">'+esc(t.name)+'</h2><button class="mx" data-act="mclose" aria-label="닫기">✕</button></div>'+
    '<div class="addrow" style="margin-bottom:14px"><button class="btn ghost" data-act="mskip">'+(isToday?'오늘은':'이날은')+' 건너뛰기</button><button class="btn ghost" data-act="mdelete" id="mDel">삭제</button></div>'+
    '<label class="mlbl" for="mName">할 일 이름</label><input id="mName" class="txt mbig" maxlength="40" value="'+esc(t.name)+'">'+
    (recent.length?'<p class="mlbl">최근 쓴 할 일 · 누르면 입력돼요</p><div class="chips">'+recent.map(function(r,i){return recChip(r,'mrecent',i);}).join('')+'</div>':'')+
    '<p class="mlbl">라벨</p><div class="daysel" id="mCats" style="margin:0 0 14px">'+catChips('m',t.cat,true)+'</div>'+
    '<p class="mlbl">예상 시간</p><div class="mtime"><button class="btn ghost" data-act="mstep" data-d="-1" aria-label="5분 줄이기">−</button><div class="mval"><b id="mVal">'+t.min+'</b> 분</div><button class="btn ghost" data-act="mstep" data-d="1" aria-label="5분 늘리기">＋</button></div>'+
    '<div class="ruler" id="mRuler">'+rulerHtml(t.min)+'</div>'+
    '<p class="mnote" id="mNote"><b>'+(isX?(isToday?'오늘만 사용하는 일회성 일정입니다.':'이날만 사용하는 일회성 일정입니다.'):'요일 루틴이에요.')+'</b><br><span class="muted">'+(isX?(isToday?'오늘에만 반영돼요.':'이날에만 반영돼요.'):'이름·시간·라벨을 고치면 이 루틴을 쓰는 모든 요일에 반영돼요.')+'</span></p>'+
    '<p class="err" id="mErr"></p>'+

  var m=document.querySelector('#modalRoot .modal');if(m)m.focus();
}
function openActual(t){
  var r=recOf(DB.cur,ui.date,t),m=Math.round(elapsed(r)/60);
  ui.modal={k:t.kind+':'+t.id,a:true,min:m};ui.menuKey=null;
  var h='<div class="mback" id="mback"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" tabindex="-1">'+
    '<div class="mhead"><h2 id="mTitle">⏱ 실제 시간 입력</h2><button class="mx" data-act="mclose" aria-label="닫기">✕</button></div>'+
    '<p style="margin:0 0 4px">'+lbTag(t.cat)+esc(t.name)+'</p><p class="muted" style="margin:0 0 14px">예상 '+t.min+'분 · 타이머를 못 눌렀거나 중간에 멈췄을 때 직접 맞춰요.</p>'+
    '<div class="mtime"><button class="btn ghost" data-act="astep" data-d="-5" aria-label="5분 줄이기">−5</button><div class="mval"><input id="aMin" class="minp" type="number" min="0" max="600" value="'+m+'" aria-label="실제 시간(분)" style="width:84px;font-size:28px;text-align:center"> 분</div><button class="btn ghost" data-act="astep" data-d="5" aria-label="5분 늘리기">+5</button></div>'+
    '<div class="addrow" style="justify-content:center;margin:10px 0 4px"><button class="btn ghost sm" data-act="astep" data-d="-1">−1분</button><button class="btn ghost sm" data-act="astep" data-d="1">+1분</button><button class="btn ghost sm" data-act="aest">예상 시간으로</button></div>'+
    '<p class="err" id="aErr"></p><div class="mfoot"><button class="btn ghost" data-act="mclose">취소</button><button class="btn" data-act="asave">저장</button></div></div></div>';
  document.getElementById('modalRoot').innerHTML=h;

}
function setActualMin(t,v){
  var r=recOf(DB.cur,ui.date,t),sec=Math.max(0,Math.min(600,Math.round(v)))*60;
  if(r.start)r.start=Date.now();
  r.acc=sec;
  var tot=t.min*60;
  if(sec<tot)r.alerted=false;
  if(r.done){r.over=sec>tot;r.pts=PT_DONE+((sec>0&&!r.over)?PT_BONUS:0);}
}
function closeModal(){ui.modal=null;ui.menuKey=null;document.getElementById('modalRoot').innerHTML='';}
function setModalMin(v){ui.modal.min=v;document.getElementById('mVal').textContent=v;document.getElementById('mRuler').innerHTML=rulerHtml(v);}
function skipTask(t){
  var r=recOf(DB.cur,ui.date,t);
  if(r.start){r.acc+=(Date.now()-r.start)/1000;r.start=null;}
  r.skip=true;r.done=false;r.pts=0;r.over=false;
  save();toast((ui.date===todayKey()?'오늘은':'이날은')+' 건너뛰었어요');
}

function renderTimer(){
  var t=findTask(ui.timerKey);
  if(!t||ui.tab!=='today'){ui.timerKey=null;return renderToday();}
  return '<div class="card" id="tmCard" style="cursor:pointer"><div class="tmtop"><span class="tlbl">집중모드</span><button class="btn ghost sm" data-act="tback">← 목록</button></div><div class="tmhead"><h2>'+lbTag(t.cat)+''+esc(t.name)+'</h2><span class="tag">예상 '+t.min+'분</span></div>'+
    '<div class="tmtimes"><div><div class="tlbl">현재 시각</div><div class="tbig" id="tmNow">--:--</div></div><div style="text-align:right"><div class="tlbl">예상 종료</div><div class="tbig" id="tmEnd">--:--</div></div></div>'+
    '<div class="ringwrap"><button class="sndb'+(DB.settings.sound?'':' off')+'" data-act="tsound" id="tmSnd" aria-label="소리 켜기/끄기">'+sndIcon(DB.settings.sound)+'</button>'+
    '<svg viewBox="0 0 200 200" class="ring" role="img" aria-label="남은 시간 원형 표시"><circle class="rtrack" cx="100" cy="100" r="88"/><circle class="rarc" id="tmRing" cx="100" cy="100" r="88"/><image id="tmKnob" href="'+BUNNY+'" width="32" height="32" x="172" y="84" transform="rotate(90 188 100)" pointer-events="none"/></svg>'+
    '<button class="rcen" data-act="tpause" aria-label="타이머 일시정지 또는 계속"><span class="tlbl" id="tmLbl">남은 시간</span><span class="rbig" id="tmRem">0:00</span><span class="rpause" id="tmState">⏸ 일시정지</span></button></div>'+
    '<p class="muted" style="text-align:center;margin:-6px 0 14px">누르면 일시정지 · 계속<br>원의 테두리를 끌면 시간을 조절해요</p>'+
    '<div class="tadj"><span class="muted">시간 조절</span><button class="btn ghost sm" data-act="tadj" data-v="-5">−5분</button><button class="btn ghost sm" data-act="tadj" data-v="-1">−1분</button><button class="btn ghost sm" data-act="tadj" data-v="1">+1분</button><button class="btn ghost sm" data-act="tadj" data-v="5">+5분</button></div>'+

function setText(id,s){var e=document.getElementById(id);if(e&&e.textContent!==s)e.textContent=s;}
function updateTimerView(){
  var t=findTask(ui.timerKey);if(!t||!t.rec)return;
  var r=t.rec,total=t.min*60,el=elapsed(r),rem=total-el,over=rem<0,run=!!r.start,now=new Date();
  setText('tmNow',pad(now.getHours())+':'+pad(now.getMinutes()));
  var end=new Date(now.getTime()+Math.max(0,rem)*1000);
  setText('tmEnd',over?'—':(!run?'재개 후 표시':pad(end.getHours())+':'+pad(end.getMinutes())));
  setText('tmLbl',over?'초과 시간':(run?'남은 시간':'⏸ 일시정지 중'));
  var rc=document.querySelector('.rcen');if(rc)rc.classList.toggle('pz',!run&&!over);
  setText('tmRem',over?'+'+fmt(-rem):fmt(Math.ceil(rem)));
  setText('tmState',run?'⏸ 일시정지':'▷ 계속');
  var ring=document.getElementById('tmRing');
  if(ring){var f=over?1:Math.max(0,rem/total);ring.style.strokeDasharray=RING_C;ring.style.strokeDashoffset=RING_C*(1-f);ring.classList.toggle('over',over);ring.classList.toggle('paused',!run&&!over);
    var kb=document.getElementById('tmKnob');if(kb){var an=f*2*Math.PI;var kx=100+88*Math.cos(an),ky=100+88*Math.sin(an);kb.setAttribute('x',(kx-16).toFixed(2));kb.setAttribute('y',(ky-16).toFixed(2));kb.setAttribute('transform','rotate(90 '+kx.toFixed(2)+' '+ky.toFixed(2)+')');kb.style.display=over?'none':'';}}
}
function openTimer(t){
  var r=recOf(DB.cur,ui.date,t);
  if(r.skip){toast('건너뛴 일이에요. 복구해 주세요');return;}
  if(r.done){toast('끝낸 일이에요. 체크를 풀면 다시 잴 수 있어요');return;}
  if(!r.start){
    tasksFor(DB.cur,ui.date).forEach(function(o){if(!(o.kind===t.kind&&o.id===t.id)&&o.rec&&o.rec.start){o.rec.acc+=(Date.now()-o.rec.start)/1000;o.rec.start=null;}});
    r.start=Date.now();
  }
  audio();ui.timerKey=t.kind+':'+t.id;save();render();
}
function render(){
  syncTreasure();
  renderProfiles();renderTabs();
  var v=document.getElementById('view');
  if(ui.timerKey&&ui.tab==='today'){v.innerHTML=renderTimer();if(ui.timerKey){updateTimerView();}return;}
  ui.timerKey=null;
  v.innerHTML=ui.tab==='today'?renderToday():ui.tab==='routines'?renderRoutines():ui.tab==='stats'?renderStats():ui.tab==='rewards'?renderRewards():renderSettings();

function toggleDone(t){
  var r=recOf(DB.cur,ui.date,t);
  if(r.skip){toast('건너뛴 일이에요. 복구하면 체크할 수 있어요');return;}
  if(!r.done){
    if(r.start){r.acc+=(Date.now()-r.start)/1000;r.start=null;}
    r.done=true;r.over=r.acc>t.min*60;r.pts=PT_DONE+((r.acc>0&&!r.over)?PT_BONUS:0);
    toast('🎉 +'+r.pts+'포인트');ui.cheer=t.name;praise();
  }else{r.done=false;r.pts=0;r.over=false;}
  save();render();
}
function toggleTimer(t){
  var r=recOf(DB.cur,ui.date,t);
  if(r.done){toast('끝낸 일이에요. 체크를 풀면 다시 잴 수 있어요');return;}
  if(r.start){r.acc+=(Date.now()-r.start)/1000;r.start=null;}
  else{
    tasksFor(DB.cur,ui.date).forEach(function(o){if(!(o.kind===t.kind&&o.id===t.id)&&o.rec&&o.rec.start){o.rec.acc+=(Date.now()-o.rec.start)/1000;o.rec.start=null;}});

}

      r.alerted=true;save();

  else if(a==='lbltoggle'){var f=document.getElementById('lblf_'+el.dataset.t);f.hidden=!f.hidden;if(!f.hidden)document.getElementById('lbln_'+el.dataset.t).focus();}
  else if(a==='icopick'){ui.newIcon=el.dataset.i;el.parentNode.querySelectorAll('.chip').forEach(function(b){b.classList.toggle('on',b===el);});}
  else if(a==='colpick'){ui.newColor=el.dataset.c;document.querySelectorAll('.cwrow[id^="lblc_"]').forEach(function(w){w.innerHTML='<span class="muted">색</span>'+colorChips(ui.newColor,'colpick');});}
  else if(a==='coledit'){ui.colorEdit=ui.colorEdit===id?null:id;render();}
  else if(a==='colset'){var cc=DB.cats.filter(function(c){return c.id===id;})[0];if(cc){cc.color=el.dataset.c;save();render();}}
  else if(a==='lbladd'){
    var g=el.dataset.t,inp=document.getElementById('lbln_'+g),er=document.getElementById('lble_'+g),nm=inp.value.trim();
    if(!nm){er.textContent='라벨 이름을 적어 주세요';return;}
    if(DB.cats.some(function(c){return c.name.toLowerCase()===nm.toLowerCase();})){er.textContent='이미 있는 라벨이에요';return;}
    if(DB.cats.length>=20){er.textContent='라벨은 20개까지 만들 수 있어요';return;}
    var nc={id:'c'+uid(),name:nm,icon:ui.newIcon,color:ui.newColor};
    DB.cats.splice(DB.cats.length-1,0,nc);
    if(g==='r')ui.formCat=nc.id;else if(g==='x')ui.xCat=nc.id;
    save();
    if(g==='s'){render();toast('"'+nm+'" 라벨을 만들었어요');}
    else{var rc=document.getElementById('rCats'),xc=document.getElementById('xCats');if(rc)rc.innerHTML=catChips('r',ui.formCat);if(xc)xc.innerHTML=catChips('x',ui.xCat);inp.value='';er.textContent='';document.getElementById('lblf_'+g).hidden=true;toast('"'+nm+'" 라벨을 만들었어요');}
  }
  else if(a==='lbldel'){
    DB.cats=DB.cats.filter(function(c){return c.id!==id;});
    if(ui.formCat===id)ui.formCat='etc';if(ui.xCat===id)ui.xCat='etc';
    save();render();toast('라벨을 지웠어요');
  }
  else if(a==='cat'){var c=el.dataset.c;if(el.dataset.t==='r')ui.formCat=c;else if(el.dataset.t==='m')ui.modal.cat=c;else ui.xCat=c;var box=el.parentNode;box.querySelectorAll('.chip').forEach(function(b){b.classList.toggle('on',b===el);});}
  else if(a==='tpause'){var t3=findTask(ui.timerKey);if(t3)toggleTimer(t3);}
  else if(a==='tback'){ui.timerKey=null;render();}
  else if(a==='tfin'){var t4=findTask(ui.timerKey);ui.timerKey=null;if(t4)toggleDone(t4);else render();}
  else if(a==='tsound'){DB.settings.sound=!DB.settings.sound;if(DB.settings.sound){audio();beep();}save();el.innerHTML=sndIcon(DB.settings.sound);el.classList.toggle('off',!DB.settings.sound);}
  else if(a==='delx'){var p=k.split(':'),log=ensureLog(DB.cur,ui.date);log.x=log.x.filter(function(x){return x.id!==p.slice(1).join(':');});ui.menuKey=null;save();render();}
  else if(a==='step'){var inp=document.getElementById(el.dataset.t),v=parseInt(inp.value,10);if(isNaN(v))v=20;inp.value=Math.max(1,Math.min(600,v+(+d)));}
  else if(a==='addx')addExtra();
  else if(a==='rwday'){ui.rwDay=+d;if(!ui.editId)ui.formDays=[+d];render();}
  else if(a==='dayt'){var n=+d,i=ui.formDays.indexOf(n);if(i>-1)ui.formDays.splice(i,1);else ui.formDays.push(n);el.classList.toggle('on',i===-1);}
  else if(a==='saver')saveRoutine();
  else if(a==='editr'){var r=DB.routines[DB.cur].filter(function(x){return x.id===id;})[0];if(r){ui.editId=id;ui.formDays=r.days.slice();ui.formCat=r.cat||'etc';render();document.getElementById('rName').focus();}}
  else if(a==='cancele'){ui.editId=null;ui.formDays=[ui.rwDay];render();}
  else if(a==='delr'){DB.routines[DB.cur]=DB.routines[DB.cur].filter(function(x){return x.id!==id;});if(ui.editId===id)ui.editId=null;save();render();toast('지웠어요');}
  else if(a==='sampleR')addSampleRoutines();
  else if(a==='sampleW')addSampleRewards();
  else if(a==='swk'){ui.statWeek=d==='0'?0:ui.statWeek+(+d);render();}
  else if(a==='addrw'){
    var n2=document.getElementById('wName').value.trim(),c=parseInt(document.getElementById('wCost').value,10),er=document.getElementById('wErr');
    if(!n2){er.textContent='보상 이름을 적어 주세요';return;}
    if(isNaN(c)||c<1||c>9999){er.textContent='포인트는 1~9999 사이로 넣어 주세요';return;}
    DB.rewards[DB.cur].push({id:uid(),name:n2,cost:c,emoji:ui.rwEmoji});save();render();toast('보상을 추가했어요');
  }
  else if(a==='rwemo'){ui.rwEmoji=id;var ce=document.getElementById('rwEmo');if(ce)ce.innerHTML=rwEmoChips();}
  else if(a==='tsel'){tOf(DB.cur).sel=el.dataset.id;save();render();}
  else if(a==='resetask'){ui.confirmReset=true;render();}
  else if(a==='resetx'){ui.confirmReset=false;ui.confirmClear=false;ui.delKey=null;render();}
  else if(a==='clearask'){ui.confirmClear=true;render();}
  else if(a==='cleargo'){
    var ts=tasksFor(DB.cur,ui.date),ids={};
    ts.forEach(function(t){if(t.kind==='r')ids[t.id]=1;});
    Object.keys(ids).forEach(function(rid){hideToday(DB.cur,ui.date,rid);});
    var lg2=ensureLog(DB.cur,ui.date);lg2.x=[];
    ui.confirmClear=false;ui.menuKey=null;save();render();toast('할 일을 모두 삭제했어요');
  }
  else if(a==='resetgo'){
    var lg=ensureLog(DB.cur,ui.date);lg.t={};
    lg.x.forEach(function(x){x.done=false;x.skip=false;x.acc=0;x.start=null;x.pts=0;x.over=false;x.alerted=false;});
    ui.confirmReset=false;ui.confirmClear=false;ui.delKey=null;ui.menuKey=null;save();render();toast('할 일 기록을 초기화했어요');
  }
  else if(a==='sort'){if(ui.sort===id&&id!=='def')ui.sortDir=-ui.sortDir;else{ui.sort=id;ui.sortDir=1;}render();}
  else if(a==='togems'){ui.tab='rewards';render();window.scrollTo(0,0);}
  else if(a==='redeem'){
    var rw=DB.rewards[DB.cur].filter(function(x){return x.id===id;})[0];if(!rw)return;
    var b=balance(DB.cur);
    if(b<rw.cost){toast('포인트가 모자라요 (필요 '+rw.cost+'P, 보유 '+b+'P)');return;}
    DB.redeemed[DB.cur].push({id:uid(),name:rw.name,cost:rw.cost,emoji:rw.emoji||'',date:todayKey()});save();render();toast((rw.emoji||'🎁')+' "'+rw.name+'" 교환 완료!');
  }
  else if(a==='delrw'){DB.rewards[DB.cur]=DB.rewards[DB.cur].filter(function(x){return x.id!==id;});save();render();}
  else if(a==='addprof'){
    var inp2=document.getElementById('pNew'),nm=inp2.value.trim(),pe=document.getElementById('pErr');
    if(!nm){pe.textContent='이름을 적어 주세요';return;}
    var np={id:'p'+uid(),name:nm,emoji:ui.pEmo||EMOJI[DB.profiles.length%EMOJI.length]};
    ui.pEmo=null;DB.profiles.push(np);normalize(DB);DB.cur=np.id;save();render();toast(nm+' 프로필을 만들었어요');
  }
  else if(a==='pemoedit'){ui.pEmoEdit=ui.pEmoEdit===id?null:id;render();}
  else if(a==='pemoset'){var pp=DB.profiles.filter(function(x){return x.id===ui.pEmoEdit;})[0];if(pp){pp.emoji=id;save();}ui.pEmoEdit=null;render();}
  else if(a==='pemonew'){var nv=document.getElementById('pNew'),keep=nv?nv.value:'';ui.pEmo=id;render();nv=document.getElementById('pNew');if(nv)nv.value=keep;}
  else if(a==='delprof'){if(DB.profiles.length<2){toast('프로필은 하나 이상 있어야 해요');return;}ui.confirmDel=id;render();}
  else if(a==='delprofx'){ui.confirmDel=null;render();}
  else if(a==='delprof2'){
    DB.profiles=DB.profiles.filter(function(p){return p.id!==id;});
    ['routines','logs','rewards','redeemed','treasure'].forEach(function(m){delete DB[m][id];});
    ui.confirmDel=null;normalize(DB);save();render();toast('프로필을 지웠어요');
  }
  else if(a==='sound'){DB.settings.sound=!DB.settings.sound;if(DB.settings.sound){audio();beep();}save();render();}
  else if(a==='notiperm'){
    if(DB.settings.notify){DB.settings.notify=false;save();render();return;}
    if(!window.Notification){toast('이 브라우저는 알림을 지원하지 않아요');return;}
    Notification.requestPermission().then(function(p){DB.settings.notify=(p==='granted');save();render();if(p!=='granted')toast('브라우저에서 알림이 허용되지 않았어요');});
  }
  else if(a==='export')download();
  else if(a==='importgo'){DB=normalize(ui.pendingImport);ui.pendingImport=null;ui.date=todayKey();save();render();toast('백업을 불러왔어요');}
  else if(a==='importcancel'){ui.pendingImport=null;render();}
  else if(a==='sygen'){document.getElementById('syCodeI').value=syRandCode();}
  else if(a==='sycopy'){
    var cc=document.getElementById('syCodeI').value.trim();
    if(!cc){syStat('코드를 먼저 넣어 주세요',true);return;}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(cc).then(function(){toast('코드를 복사했어요');},function(){toast('복사하지 못했어요. 직접 적어 주세요');});}
    else toast('이 브라우저에서는 복사할 수 없어요');
  }
  else if(a==='syon'){
    var co=document.getElementById('syCodeI').value.trim();
    if(co.indexOf('|')>-1)co=co.split('|').pop().trim();
    if(!/^[A-Za-z0-9]{12,48}$/.test(co)){syStat('코드는 영문과 숫자 12~48자로 넣어 주세요 (새 코드 만들기를 눌러도 돼요)',true);return;}
    SY={code:co,on:true};sySave();render();syStat('연결하는 중…');syPull(true);
  }
  else if(a==='syoff'){SY.on=false;sySave();clearTimeout(syT);render();}
  else if(a==='sysync'){syPull(false);syPush();}
});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='noteTxt')ui.noteDraft=e.target.value;});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.chg==='pname'){var p=DB.profiles.filter(function(x){return x.id===t.dataset.id;})[0],v=t.value.trim();if(p&&v){p.name=v;save();renderProfiles();}else if(p){t.value=p.name;}}
  if(t.id==='impFile'&&t.files&&t.files[0]){
    var rd=new FileReader();
    rd.onload=function(){
      var er;
      try{var o=JSON.parse(rd.result);if(!validDB(o))throw new Error('x');ui.pendingImport=o;render();}
      catch(x){ui.pendingImport=null;render();er=document.getElementById('iErr');if(er)er.textContent='루틴 놀이터에서 내보낸 백업 파일이 아니에요';}
    };
    rd.readAsText(t.files[0]);t.value='';
  }
});
var rdrag=null;
function ringFrac(e,wrap){
  var b=wrap.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2,dx=e.clientX-cx,dy=e.clientY-cy;
  var dist=Math.sqrt(dx*dx+dy*dy)/(b.width/2),ang=Math.atan2(dx,-dy);if(ang<0)ang+=2*Math.PI;
  return {f:ang/(2*Math.PI),dist:dist};
}
document.addEventListener('pointerdown',function(e){
  if(!ui.timerKey)return;
  var wrap=e.target.closest&&e.target.closest('.ringwrap');if(!wrap||e.target.closest('.sndb')||e.target.closest('.rcen'))return;
  var g=ringFrac(e,wrap);if(g.dist<0.66||g.dist>1.12)return;
  var t=findTask(ui.timerKey);if(!t)return;
  var r=recOf(DB.cur,ui.date,t);if(r.done)return;
  rdrag={wrap:wrap,t:t,last:Math.max(0,1-elapsed(r)/(t.min*60)),moved:false};
  try{wrap.setPointerCapture(e.pointerId);}catch(x){}
  var rg=document.getElementById('tmRing');if(rg)rg.classList.add('dragging');
  e.preventDefault();
});
document.addEventListener('pointermove',function(e){
  if(!rdrag)return;
  var g=ringFrac(e,rdrag.wrap),f=g.f;
  if(rdrag.last>0.75&&f<0.25)f=1;else if(rdrag.last<0.25&&f>0.75)f=0;
  rdrag.last=f;rdrag.moved=true;
  var tot=rdrag.t.min*60,elMin=Math.round(tot/60*(1-f));
  setActualMin(rdrag.t,elMin);updateTimerView();
});
function endDrag(){if(!rdrag)return;var rg=document.getElementById('tmRing');if(rg)rg.classList.remove('dragging');var mv=rdrag.moved;rdrag=null;if(mv){save();window.__ringDragged=true;setTimeout(function(){window.__ringDragged=false;},350);}}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&ui.modal){closeModal();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('clk')){e.preventDefault();e.target.click();return;}
  if(e.key==='Enter'&&e.target.id==='mName'){var sv=document.querySelector('[data-act="msave"]');if(sv)sv.click();return;}
  if(e.key!=='Enter')return;
  var m={xName:'addx',rName:'saver',wName:'addrw',wCost:'addrw',pNew:'addprof'}[e.target.id];
  if(!m&&/^lbln_/.test(e.target.id)){var lb=document.querySelector('[data-act="lbladd"][data-t="'+e.target.id.slice(5)+'"]');if(lb)lb.click();return;}
  if(m){var b=document.querySelector('[data-act="'+m+'"]');if(b)b.click();}
});

render();
setInterval(tick,1000);
if(syOk())syPull(false);
setInterval(function(){if(syOk()&&!document.hidden)syPull(false);},10000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&syOk())syPull(false);});
</script>
