<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>💛 우리 딸 WAVE 체크리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     디자인 토큰 (라이트 & 다크 모드)
     ============================================================ */
  :root{
    --bg:#eef8fb;
    --bg-grad: linear-gradient(160deg,#eaf7fb 0%,#e7fbf5 100%);
    --card-bg:#ffffff;
    --card-bg-soft:#f4fbfd;
    --sky:#3fb6e0;
    --sky-strong:#2a9fcb;
    --sky-light:#dbf2fb;
    --mint:#3fd6bf;
    --mint-strong:#22b39d;
    --mint-light:#dcf9f2;
    --text:#1f2d3a;
    --text-soft:#6b7f8c;
    --text-faint:#9db0bb;
    --border:#e1eef2;
    --border-strong:#c9dfe6;
    --shadow-sm:0 2px 8px rgba(31,64,80,.06);
    --shadow-md:0 8px 24px rgba(31,64,80,.10);
    --shadow-lg:0 16px 40px rgba(31,64,80,.16);
    --radius-sm:10px;
    --radius-md:16px;
    --radius-lg:22px;
    --danger:#f0645f;
    --danger-light:#fde6e5;
    --warning:#f5a623;
    --warning-light:#fff3dc;
    --gold:#e8b400;
    --success:#2fbf87;
    --font-main: 'Jua', -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#0e1620;
    --bg-grad: linear-gradient(160deg,#0d1620 0%,#0d1c1c 100%);
    --card-bg:#161f2a;
    --card-bg-soft:#131b25;
    --sky:#4fc3ec;
    --sky-strong:#6fd0f0;
    --sky-light:#16303a;
    --mint:#3fe0c6;
    --mint-strong:#4fe8d0;
    --mint-light:#123028;
    --text:#e8f1f5;
    --text-soft:#9fb3bf;
    --text-faint:#6d8390;
    --border:#233240;
    --border-strong:#2e4250;
    --shadow-sm:0 2px 8px rgba(0,0,0,.25);
    --shadow-md:0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 16px 40px rgba(0,0,0,.5);
    --danger:#ff6b66;
    --danger-light:#3a1f20;
    --warning:#ffb84d;
    --warning-light:#3a2c14;
    --gold:#ffd166;
    --success:#3fdb9a;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-main);
    background:var(--bg-grad);
    color:var(--text);
    min-height:100vh;
    transition:background .3s ease,color .3s ease;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:60px;
  }
  ::selection{background:var(--mint-light);}
  h1,h2,h3,h4{margin:0;font-family:var(--font-main);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------------- 상단 고정 바 ---------------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    backdrop-filter:blur(14px) saturate(160%);
    background:color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom:1px solid var(--border);
    padding:14px 20px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .topbar h1{
    font-size:20px;font-weight:800;letter-spacing:-.3px;
    display:flex;align-items:center;gap:8px;margin-right:auto;
    background:linear-gradient(100deg,var(--sky-strong),var(--mint-strong));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    white-space:nowrap;
  }
  .topbar .icon-btn{
    border:1px solid var(--border-strong);background:var(--card-bg);
    border-radius:12px;padding:9px 12px;font-size:14px;color:var(--text);
    display:flex;align-items:center;gap:6px;transition:all .15s ease;
    box-shadow:var(--shadow-sm);white-space:nowrap;
  }
  .topbar .icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:var(--sky);}
  .topbar .icon-btn.danger:hover{border-color:var(--danger);color:var(--danger);}
  .person-select{
    border:1px solid var(--border-strong);background:var(--card-bg);border-radius:12px;
    padding:9px 12px;font-size:14px;color:var(--text);max-width:180px;box-shadow:var(--shadow-sm);
  }

  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 40px;}

  /* ---------------- 이름/타이틀 카드 ---------------- */
  .name-card{
    background:var(--card-bg);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-md);padding:18px 20px;margin-bottom:16px;
    border:1px solid var(--border);position:relative;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    animation:fadeUp .35s ease both;
  }
  .name-card::before{
    content:"";position:absolute;top:-11px;left:50%;width:76px;height:20px;
    transform:translateX(-50%) rotate(-3deg);
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.55) 0 5px, rgba(63,182,224,.35) 5px 10px);
    border:1px solid rgba(63,182,224,.35);border-radius:2px;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .name-title{font-size:22px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:8px;}
  .name-title .who{color:var(--mint-strong);}
  .name-edit-btn{
    border:1px solid var(--border-strong);background:var(--card-bg-soft);border-radius:10px;
    padding:7px 12px;font-size:13px;color:var(--text-soft);margin-left:auto;box-shadow:var(--shadow-sm);
  }
  .name-edit-btn:hover{border-color:var(--sky);color:var(--text);}

  /* ---------------- 엄마 편지 ---------------- */
  .letter-card{
    background:linear-gradient(160deg,#fff8f0 0%,var(--card-bg) 100%);
    border:1px solid var(--warning);border-radius:var(--radius-md);
    padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow-sm);
    font-size:13.5px;line-height:1.6;font-weight:600;color:var(--text-soft);
  }
  html[data-theme="dark"] .letter-card{background:linear-gradient(160deg,#241d12 0%,var(--card-bg) 100%);}
  .letter-card b{color:var(--text);}

  /* ---------------- 전체 진행 배너 ---------------- */
  .progress-banner{
    background:linear-gradient(110deg,var(--sky),var(--mint));
    color:#fff;border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:16px;
    box-shadow:var(--shadow-lg);
  }
  .progress-banner .pb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .progress-banner .pb-label{font-size:14px;font-weight:700;opacity:.95;}
  .progress-banner .pb-pct{font-size:34px;font-weight:900;letter-spacing:-1px;}
  .pb-outer{background:rgba(255,255,255,.32);border-radius:20px;height:14px;overflow:hidden;margin-top:12px;}
  .pb-inner{height:100%;border-radius:20px;background:#fff;transition:width .6s cubic-bezier(.4,0,.2,1);}
  .pb-sub{font-size:13px;opacity:.92;font-weight:600;margin-top:8px;}

  /* ---------------- 카테고리 네비게이션 ---------------- */
  .datenav-card{
    background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow-sm);
  }
  .datenav-card .dn-title{font-size:12px;color:var(--text-soft);font-weight:700;margin-bottom:8px;}
  .datenav-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
  .datenav-chip{
    flex:0 0 auto;border:1px solid var(--border-strong);background:var(--card-bg-soft);
    border-radius:14px;padding:8px 14px;font-size:13px;font-weight:800;color:var(--text-soft);
    transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:6px;
  }
  .datenav-chip:hover{border-color:var(--sky);color:var(--text);transform:translateY(-1px);}
  .datenav-chip .dn-dot{width:8px;height:8px;border-radius:50%;background:var(--sky);}
  .datenav-chip.done .dn-dot{background:var(--success);}

  /* ---------------- 카테고리(주제 카드) ---------------- */
  .category-group{
    background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);
    margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow-sm);scroll-margin-top:80px;
    animation:fadeUp .3s ease both;position:relative;
  }
  .category-group.complete{border-color:var(--success);}
  .category-group.flash{animation:flashHl 1.1s ease;}
  @keyframes flashHl{0%{box-shadow:0 0 0 3px var(--mint);}100%{box-shadow:var(--shadow-sm);}}

  /* 100% 완료 도장 스탬프 */
  .stamp{
    position:absolute;bottom:12px;right:14px;z-index:5;pointer-events:none;
    font-size:15px;font-weight:900;letter-spacing:.5px;
    color:var(--success);border:2.5px solid var(--success);border-radius:10px;
    padding:5px 12px;transform:rotate(-14deg);text-transform:uppercase;
    background:color-mix(in srgb, var(--success) 12%, var(--card-bg));
    box-shadow:0 1px 3px rgba(0,0,0,.08);opacity:.92;
    animation:stampIn .45s cubic-bezier(.2,1.4,.4,1) both;
  }
  .stamp::before{content:"✓ ";}
  @keyframes stampIn{
    0%{opacity:0;transform:rotate(-14deg) scale(2.4);}
    60%{opacity:.92;transform:rotate(-14deg) scale(.9);}
    100%{opacity:.92;transform:rotate(-14deg) scale(1);}
  }

  .category-header{
    display:flex;align-items:flex-start;gap:10px;padding:14px 16px;cursor:pointer;user-select:none;
  }
  .category-header:hover{background:var(--card-bg-soft);}
  .cat-date{
    flex:0 0 auto;background:var(--sky-light);color:var(--sky-strong);
    border-radius:10px;padding:8px;font-size:20px;font-weight:800;min-width:44px;text-align:center;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .cat-main{flex:1 1 auto;min-width:0;}
  .cat-title{font-size:15.5px;font-weight:800;line-height:1.35;}
  .cat-progress-line{display:flex;align-items:center;gap:8px;margin-top:7px;}
  .cat-mini-outer{flex:1 1 auto;background:var(--border);border-radius:20px;height:8px;overflow:hidden;max-width:220px;}
  .cat-mini-inner{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--sky),var(--mint));transition:width .5s;}
  .cat-count{font-size:12px;color:var(--text-soft);font-weight:800;white-space:nowrap;}
  .cat-count.complete{color:var(--success);}
  .caret{flex:0 0 auto;color:var(--text-faint);transition:transform .2s ease;font-size:14px;margin-top:2px;}
  .category-header.collapsed .caret{transform:rotate(-90deg);}
  .cat-actions{flex:0 0 auto;display:flex;gap:2px;}
  .cat-actions button{border:none;background:none;color:var(--text-faint);font-size:15px;padding:3px 5px;border-radius:6px;}
  .cat-actions button:hover{background:var(--card-bg-soft);color:var(--text);}
  .cat-actions .del:hover{color:var(--danger);}

  .category-body{padding:2px 12px 12px;}
  .category-body.hidden{display:none;}

  /* ---------------- 섹션 ---------------- */
  .section{
    border:1px solid var(--border);border-radius:12px;margin-top:10px;overflow:hidden;
    background:var(--card-bg-soft);
  }
  .section-header{
    display:flex;align-items:center;gap:8px;padding:10px 12px;
    font-size:14px;font-weight:800;color:var(--text);background:color-mix(in srgb,var(--sky-light) 55%,transparent);
  }
  html[data-theme="dark"] .section-header{background:color-mix(in srgb,var(--sky-light) 70%,transparent);}
  .section-header .sec-icon{font-size:15px;}
  .section-header .sec-count{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--text-soft);
    background:var(--card-bg);border-radius:10px;padding:2px 8px;}
  .section-header .sec-count.complete{color:var(--success);}
  .section-header .sec-actions{display:flex;gap:2px;}
  .section-header .sec-actions button{border:none;background:none;color:var(--text-faint);font-size:13px;padding:3px 4px;border-radius:6px;}
  .section-header .sec-actions button:hover{background:var(--card-bg);color:var(--text);}
  .section-header .sec-actions .del:hover{color:var(--danger);}
  .section-body{padding:4px 8px 8px;}

  .item-row{
    display:flex;align-items:center;gap:10px;padding:10px 6px;border-radius:10px;transition:background .15s ease;
  }
  .item-row:hover{background:var(--card-bg);}
  .item-check{
    width:23px;height:23px;border-radius:8px;border:2px solid var(--border-strong);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;transition:all .15s;color:#fff;font-size:14px;background:var(--card-bg);
  }
  .item-check:hover{border-color:var(--sky);}
  .item-check.done{background:linear-gradient(100deg,var(--sky),var(--mint));border-color:transparent;}
  .item-name{flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:600;line-height:1.4;word-break:break-word;}
  .item-row.done .item-name{color:var(--text-faint);text-decoration:line-through;text-decoration-thickness:2px;}
  .item-name-input{flex:1;border:1px solid var(--sky);border-radius:8px;padding:7px 9px;font-size:14.5px;background:var(--card-bg);color:var(--text);}
  .row-actions{display:flex;gap:2px;flex:0 0 auto;}
  .row-actions button{border:none;background:none;color:var(--text-faint);font-size:14px;padding:4px 6px;border-radius:6px;}
  .row-actions button:hover{background:var(--card-bg);color:var(--text);}
  .row-actions .del:hover{color:var(--danger);}
  .empty-msg{color:var(--text-faint);font-size:13px;padding:12px 8px;text-align:center;}

  .add-item-row{display:flex;gap:8px;padding:6px;}
  .add-item-row input{
    flex:1;border:1px dashed var(--border-strong);border-radius:10px;padding:9px 11px;
    background:var(--card-bg);color:var(--text);font-size:14px;
  }
  .add-item-row input:focus{outline:none;border-color:var(--sky);border-style:solid;box-shadow:0 0 0 3px var(--sky-light);}
  .add-item-row button{
    border:none;border-radius:10px;padding:0 15px;font-weight:800;color:#fff;font-size:14px;
    background:linear-gradient(100deg,var(--sky),var(--mint));box-shadow:0 3px 0 var(--mint-strong);
  }
  .add-item-row button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--mint-strong);}

  .add-section-btn{
    display:block;width:100%;margin-top:10px;border:1px dashed var(--border-strong);
    background:var(--card-bg-soft);color:var(--text-soft);border-radius:12px;padding:10px;
    font-size:13px;font-weight:800;transition:all .15s;
  }
  .add-section-btn:hover{border-color:var(--sky);color:var(--text);}

  /* ---------------- 새 카테고리 추가 폼 ---------------- */
  .add-cat-form{
    display:flex;flex-wrap:wrap;gap:8px;background:var(--card-bg);border:1px dashed var(--border-strong);
    border-radius:var(--radius-md);padding:14px;margin-bottom:16px;box-shadow:var(--shadow-sm);align-items:center;
  }
  .add-cat-form .ac-date{flex:0 0 70px;border:1px solid var(--border-strong);border-radius:10px;padding:10px;background:var(--card-bg-soft);color:var(--text);font-size:16px;text-align:center;}
  .add-cat-form .ac-title{flex:1 1 200px;border:1px solid var(--border-strong);border-radius:10px;padding:10px 12px;background:var(--card-bg-soft);color:var(--text);font-size:14px;}
  .add-cat-form button{
    border:none;border-radius:10px;padding:10px 18px;font-weight:800;color:#fff;font-size:14px;
    background:linear-gradient(100deg,var(--sky),var(--mint));box-shadow:0 3px 0 var(--mint-strong);transition:transform .1s;
  }
  .add-cat-form button:hover{transform:translateY(-1px);}
  .add-cat-form button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--mint-strong);}

  /* ---------------- 하단 통계 ---------------- */
  .stats-card{
    background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:20px;box-shadow:var(--shadow-md);
  }
  .stats-card h2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;}
  .stats-bar .stat b{display:block;font-size:20px;}
  .stats-bar .stat span{font-size:11.5px;color:var(--text-soft);}

  .back-top{
    position:fixed;bottom:22px;right:22px;width:46px;height:46px;border-radius:50%;
    background:linear-gradient(100deg,var(--sky),var(--mint));color:#fff;border:none;font-size:18px;
    box-shadow:var(--shadow-lg);display:none;align-items:center;justify-content:center;z-index:60;
  }
  .back-top.show{display:flex;}

  .toast{
    position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--text);color:var(--bg);padding:10px 20px;border-radius:30px;font-size:13.5px;font-weight:700;
    box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .3s ease;z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:600px){
    .stats-bar{grid-template-columns:repeat(2,1fr);}
    .topbar h1{font-size:16px;}
    .name-title{font-size:19px;}
    .cat-mini-outer{max-width:120px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>💛 WAVE 체크리스트</h1>
  <select class="person-select" id="personSelect"></select>
  <button class="icon-btn" id="newPersonBtn">➕ 새 사람</button>
  <button class="icon-btn" id="renamePersonBtn">✏️ 이름</button>
  <button class="icon-btn danger" id="resetBtn" title="이 사람의 모든 체크를 해제하고 기본 목록으로 되돌립니다">🔄 처음으로 돌리기</button>
  <button class="icon-btn danger" id="clearAllBtn" title="이 사람의 카테고리와 할 일을 모두 삭제합니다">🧹 모두 지우기</button>
  <button class="icon-btn" id="darkToggle">🌙</button>
</div>

<div class="wrap">

  <div class="name-card">
    <div class="name-title"><span class="who" id="whoName">누구</span><span>'s To do list</span></div>
    <button class="name-edit-btn" id="editNameInline">이름 바꾸기</button>
  </div>

  <div class="letter-card">
    사랑하는 우리 딸들의 뜻깊고 신나는 <b>WAVE 해외문화체험학습!</b> 읽으면서 하나씩 체크하렴 💛<br>
    지구 반대편 유럽대륙에서 보내는 열흘! 씩씩하게 즐겁게, 하루하루 의미있고 행복하게 지내길 바래. 목숨보다 더 아끼고 사랑하는 내 분신들!
  </div>

  <div class="progress-banner">
    <div class="pb-row">
      <span class="pb-label" id="pbLabel">할 일 진행 현황</span>
      <span class="pb-pct" id="pbPct">0%</span>
    </div>
    <div class="pb-outer"><div class="pb-inner" id="pbInner" style="width:0%"></div></div>
    <div class="pb-sub" id="pbSub">0 / 0 완료</div>
  </div>

  <div class="datenav-card" id="dateNavCard">
    <div class="dn-title">📍 누르면 해당 항목으로 이동해요</div>
    <div class="datenav-scroll" id="dateNavScroll"></div>
  </div>

  <div id="categoriesContainer"></div>

  <form class="add-cat-form" id="addCatForm">
    <input class="ac-date" type="text" id="newCatIcon" placeholder="🙂" maxlength="2">
    <input class="ac-title" type="text" id="newCatTitle" placeholder="새 카테고리 이름 (예: 파리 관광)" required>
    <button type="submit">＋ 카테고리 추가</button>
  </form>

  <div class="stats-card">
    <h2>📊 통계</h2>
    <div class="stats-bar" id="statsBar"></div>
  </div>

</div>

<button class="back-top" id="backTop">↑</button>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   💛 우리 딸 WAVE 체크리스트 — Vanilla JS · 단일 파일 · LocalStorage 기반
   카테고리(주제) → 섹션 → 할 일(items) 구조
   ===================================================================== */

const STORAGE_KEY = 'waveLetterChecklistApp_v6';

/* ---------- 기본 카테고리(주제) — 엄마 편지 기준 할 일 ---------- */
function defaultCategories(){
  return [

/* ---------- 유틸 ---------- */
const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
const uid = ()=> 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- 상태 ----------
state = { darkMode, currentPersonId, people:{ [id]:person } }
person = { id, name, categories:[ cat ] }
cat = { id, icon, title, collapsed, sections:[ sec ] }
sec = { id, icon, title, collapsed, items:[ {id,text,done} ] }
--------------------------- */
let state;
let storageAvailable = true;
let memoryFallback = null;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.people) return parsed;
    }
  }catch(e){
    console.warn('localStorage 사용 불가, 메모리 모드로 전환:', e);
    storageAvailable = false;
    if(memoryFallback) return memoryFallback;
  }
  return null;
}
function saveState(){
  if(storageAvailable){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return; }
    catch(e){ console.warn('저장 실패, 메모리 모드로 전환:', e); storageAvailable = false; }
  }
  memoryFallback = state;
}

function makeDefaultPerson(name){
  return {
    id: uid(),
    name: name || '나',
    categories: defaultCategories().map(c=>({
      id: uid(), icon:c.icon, title:c.title, collapsed:false,
      sections: c.sections.map(s=>({
        id: uid(), icon:s.icon, title:s.title, collapsed:false,
        items: s.items.map(text=>({ id:uid(), text, done:false }))
      }))
    }))
  };
}
function currentPerson(){ return state.people[state.currentPersonId]; }

/* ---------- 다크모드 ---------- */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.darkMode ? 'dark':'light');
  $('#darkToggle').textContent = state.darkMode ? '☀️' : '🌙';
}
$('#darkToggle').addEventListener('click', ()=>{
  state.darkMode = !state.darkMode; saveState(); applyTheme();
});

/* ---------- 사람 선택/추가/이름변경 ---------- */
function renderPersonSelect(){
  const sel = $('#personSelect');
  sel.innerHTML = Object.values(state.people).map(p=>
    `<option value="${p.id}" ${p.id===state.currentPersonId?'selected':''}>${escapeHtml(p.name)}</option>`
  ).join('');
}
$('#personSelect').addEventListener('change', e=>{
  state.currentPersonId = e.target.value; saveState(); renderAll();
});
$('#newPersonBtn').addEventListener('click', ()=>{
  const name = prompt('새 사람 이름을 입력하세요 (기본 할 일 목록으로 생성됩니다)', '');
  if(name===null) return;
  const p = makeDefaultPerson(name.trim() || '이름없음');
  state.people[p.id] = p;
  state.currentPersonId = p.id;
  saveState(); renderAll();

});

/* ---------- 진행률 계산 ---------- */
function secStats(sec){
  const total = sec.items.length;
  const done = sec.items.filter(i=>i.done).length;
  return { total, done, pct: total?Math.round(done/total*100):0 };
}
function catStats(cat){
  const items = cat.sections.flatMap(s=>s.items);
  const total = items.length, done = items.filter(i=>i.done).length;
  return { total, done, pct: total?Math.round(done/total*100):0 };
}
function personStats(){
  const items = currentPerson().categories.flatMap(c=>c.sections.flatMap(s=>s.items));
  const total = items.length, done = items.filter(i=>i.done).length;
  return { total, done, pct: total?Math.round(done/total*100):0 };
}

/* ---------- 전체 진행 배너 ---------- */
function renderBanner(){
  const p = currentPerson();
  const { total, done, pct } = personStats();
  $('#pbLabel').textContent = `${p.name} 님의 할 일 진행 현황`;
  $('#pbPct').textContent = pct + '%';
  $('#pbInner').style.width = pct + '%';
  $('#pbSub').textContent = `${done} / ${total} 완료` + (total && done===total ? ' · 모두 끝났어요! 🎉' : '');
}

/* ---------- 카테고리 네비게이션 ---------- */
function renderDateNav(){
  const cats = currentPerson().categories;
  const nav = $('#dateNavScroll');
  const card = $('#dateNavCard');
  if(cats.length===0){ card.style.display='none'; return; }
  card.style.display='block';
  nav.innerHTML = cats.map(cat=>{
    const s = catStats(cat);
    const allDone = s.total>0 && s.done===s.total;
    return `<button class="datenav-chip ${allDone?'done':''}" data-target="${cat.id}">
      <span class="dn-dot"></span>${escapeHtml(cat.icon||'')} ${escapeHtml(cat.title)}</button>`;
  }).join('');
  $$('.datenav-chip', nav).forEach(chip=>{
    chip.addEventListener('click', ()=> jumpToCategory(chip.dataset.target));
  });
}
function jumpToCategory(catId){
  const el = document.getElementById('cat_'+catId);
  if(!el) return;
  el.scrollIntoView({ behavior:'smooth', block:'start' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

/* ---------- 카테고리(주제) 렌더링 ---------- */
function renderCategories(){
  const container = $('#categoriesContainer');
  container.innerHTML = '';
  const cats = currentPerson().categories;
  if(cats.length===0){
    container.innerHTML = '<div class="empty-msg">아직 카테고리가 없어요. 아래에서 새 카테고리를 추가해보세요 👇</div>';
    return;
  }
  cats.forEach(cat=> container.appendChild(buildCategoryBlock(cat)));
}

function buildCategoryBlock(cat){
  const { total, done, pct } = catStats(cat);
  const complete = total>0 && done===total;

  const wrap = document.createElement('div');
  wrap.className = 'category-group' + (complete?' complete':'');
  wrap.id = 'cat_'+cat.id;
  wrap.innerHTML = `
    ${complete ? '<div class="stamp">Complete!</div>' : ''}
    <div class="category-header ${cat.collapsed?'collapsed':''}">
      <span class="cat-date">${escapeHtml(cat.icon||'📌')}</span>
      <div class="cat-main">
        <div class="cat-title">${escapeHtml(cat.title)}</div>
        <div class="cat-progress-line">
          <div class="cat-mini-outer"><div class="cat-mini-inner" style="width:${pct}%"></div></div>
          <span class="cat-count ${complete?'complete':''}">${done}/${total} · ${pct}%${complete?' ✓':''}</span>
        </div>
      </div>
      <div class="cat-actions">
        <button data-act="editcat" title="카테고리 수정">✏️</button>
        <button class="del" data-act="delcat" title="카테고리 삭제">🗑️</button>
      </div>
      <span class="caret">▾</span>
    </div>
    <div class="category-body ${cat.collapsed?'hidden':''}"></div>
  `;

  const body = $('.category-body', wrap);
  if(cat.sections.length===0){
    body.appendChild(Object.assign(document.createElement('div'),{className:'empty-msg',textContent:'섹션이 없어요'}));
  }else{
    cat.sections.forEach(sec=> body.appendChild(buildSectionBlock(cat, sec)));
  }

  const addSecBtn = document.createElement('button');
  addSecBtn.className = 'add-section-btn';
  addSecBtn.textContent = '＋ 섹션 추가';
  addSecBtn.addEventListener('click', ()=> addSection(cat));
  body.appendChild(addSecBtn);

  $('.category-header', wrap).addEventListener('click', e=>{
    if(e.target.closest('.cat-actions')) return;
    cat.collapsed = !cat.collapsed;
    saveState();
    $('.category-header', wrap).classList.toggle('collapsed', cat.collapsed);
    body.classList.toggle('hidden', cat.collapsed);
  });
  $('[data-act="editcat"]', wrap).addEventListener('click', ()=> editCategory(cat));
  $('[data-act="delcat"]', wrap).addEventListener('click', ()=> deleteCategory(cat));

  return wrap;
}

/* ---------- 섹션 렌더링 ---------- */
function buildSectionBlock(cat, sec){
  const { total, done, pct } = secStats(sec);
  const complete = total>0 && done===total;

  const box = document.createElement('div');
  box.className = 'section';
  box.innerHTML = `
    <div class="section-header">
      <span class="sec-icon">${sec.icon||'📌'}</span>
      <span>${escapeHtml(sec.title)}</span>
      <span class="sec-count ${complete?'complete':''}">${done}/${total}${complete?' ✓':''}</span>
      <span class="sec-actions">
        <button data-act="editsec" title="섹션 수정">✏️</button>
        <button class="del" data-act="delsec" title="섹션 삭제">🗑️</button>
      </span>
    </div>
    <div class="section-body"></div>
  `;
  const sbody = $('.section-body', box);
  if(sec.items.length===0){
    sbody.appendChild(Object.assign(document.createElement('div'),{className:'empty-msg',textContent:'할 일이 없어요'}));
  }else{
    sec.items.forEach(item=> sbody.appendChild(buildItemRow(sec, item)));
  }

  const addRow = document.createElement('div');
  addRow.className = 'add-item-row';
  addRow.innerHTML = `<input type="text" placeholder="${escapeHtml(sec.title)}에 할 일 추가 후 Enter"><button type="button">추가</button>`;
  const addInput = $('input', addRow);
  const addBtn = $('button', addRow);
  function addItem(){
    const val = addInput.value.trim();
    if(!val) return;
    sec.items.push({ id:uid(), text:val, done:false });
    saveState(); renderAll();
    showToast('할 일이 추가되었어요 ✅');
  }
  addInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addItem(); }});
  addBtn.addEventListener('click', addItem);
  sbody.appendChild(addRow);

  $('[data-act="editsec"]', box).addEventListener('click', ()=> editSection(cat, sec));
  $('[data-act="delsec"]', box).addEventListener('click', ()=> deleteSection(cat, sec));

  return box;
}

function buildItemRow(sec, item){
  const row = document.createElement('div');
  row.className = 'item-row' + (item.done?' done':'');
  row.innerHTML = `
    <div class="item-check ${item.done?'done':''}" data-act="toggle">${item.done?'✓':''}</div>
    <span class="item-name" data-act="viewname">${escapeHtml(item.text)}</span>
    <div class="row-actions">
      <button data-act="edit" title="수정">✏️</button>
      <button class="del" data-act="delete" title="삭제">🗑️</button>
    </div>
  `;
  $('[data-act="toggle"]', row).addEventListener('click', ()=> toggleItem(item));
  $('[data-act="edit"]', row).addEventListener('click', ()=> startEditItem(row, item));
  $('[data-act="viewname"]', row).addEventListener('dblclick', ()=> startEditItem(row, item));
  $('[data-act="delete"]', row).addEventListener('click', ()=> deleteItem(sec, item));
  return row;
}

function toggleItem(item){
  item.done = !item.done;
  saveState(); renderAll();
}
function startEditItem(row, item){
  const nameSpan = $('[data-act="viewname"]', row);
  const input = document.createElement('input');
  input.type='text'; input.className='item-name-input'; input.value=item.text;
  nameSpan.replaceWith(input);
  input.focus(); input.select();
  function commit(save){
    if(save){ const v=input.value.trim(); if(v) item.text=v; }
    saveState(); renderAll();
  }
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); commit(true); }
    else if(e.key==='Escape'){ e.preventDefault(); commit(false); }
  });
  input.addEventListener('blur', ()=> commit(true));
}
function deleteItem(sec, item){
  if(!confirm('이 할 일을 삭제할까요?')) return;
  sec.items = sec.items.filter(i=>i.id!==item.id);
  saveState(); renderAll();
}

/* ---------- 섹션 추가/수정/삭제 ---------- */
function addSection(cat){
  const title = prompt('섹션 이름', '');
  if(title===null) return;
  const t = title.trim();
  if(!t){ showToast('섹션 이름을 입력해주세요'); return; }
  cat.sections.push({ id:uid(), icon:'📌', title:t, collapsed:false, items:[] });
  saveState(); renderAll();
  showToast('섹션이 추가되었어요 ✅');
}
function editSection(cat, sec){
  const title = prompt('섹션 이름', sec.title);
  if(title===null) return;
  const icon = prompt('아이콘(이모지, 비워도 됨)', sec.icon||'');
  if(icon===null) return;
  sec.title = title.trim() || sec.title;
  sec.icon = icon.trim();
  saveState(); renderAll();
  showToast('섹션이 수정되었어요 ✏️');
}
function deleteSection(cat, sec){
  if(!confirm(`"${sec.title}" 섹션을 삭제할까요?\n안의 할 일도 함께 삭제됩니다.`)) return;
  cat.sections = cat.sections.filter(s=>s.id!==sec.id);
  saveState(); renderAll();
  showToast('섹션이 삭제되었어요 🗑️');
}

/* ---------- 카테고리 수정/삭제 ---------- */
function editCategory(cat){

  if(icon===null) return;
  const title = prompt('카테고리 이름', cat.title||'');
  if(title===null) return;
  cat.icon = icon.trim();
  cat.title = title.trim() || cat.title;
  saveState(); renderAll();
  showToast('카테고리가 수정되었어요 ✏️');
}
function deleteCategory(cat){
  if(!confirm(`"${cat.title}" 카테고리를 통째로 삭제할까요?\n안의 섹션·할 일도 함께 삭제됩니다.`)) return;
  const p = currentPerson();
  p.categories = p.categories.filter(c=>c.id!==cat.id);
  saveState(); renderAll();
  showToast('카테고리가 삭제되었어요 🗑️');
}

/* ---------- 통계 ---------- */
function renderStats(){
  const p = currentPerson();
  const { total, done, pct } = personStats();
  const remain = total - done;
  const catCount = p.categories.length;
  $('#statsBar').innerHTML = `
    <div class="stat"><b>${catCount}</b><span>카테고리</span></div>
    <div class="stat"><b style="color:var(--success)">${done}</b><span>완료</span></div>
    <div class="stat"><b style="color:var(--danger)">${remain}</b><span>남음</span></div>
    <div class="stat"><b style="color:var(--sky-strong)">${pct}%</b><span>완료율</span></div>
  `;
}

/* ---------- 마스터 렌더 ---------- */
function renderAll(){
  renderPersonSelect();
  $('#whoName').textContent = currentPerson().name;
  renderBanner();
  renderDateNav();
  renderCategories();
  renderStats();
}

/* ---------- 상단 이동 버튼 ---------- */
window.addEventListener('scroll', ()=>{
  $('#backTop').classList.toggle('show', window.scrollY>400);
});
$('#backTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

/* ---------- 초기화 ---------- */
function boot(){
  state = loadState();
  if(!state){
    const doyoon = makeDefaultPerson('도윤');
    const jiyoon = makeDefaultPerson('지윤');
    state = {
      darkMode:false,
      currentPersonId: doyoon.id,
      people:{ [doyoon.id]:doyoon, [jiyoon.id]:jiyoon }
    };
    saveState();
  }
  applyTheme();
  renderAll();
  if(!storageAvailable){
    setTimeout(()=> showToast('⚠️ 이 브라우저는 저장이 안돼요. 일반 브라우저로 열어주세요'), 500);
  }
}
boot();
</script>
</body>
</html>
